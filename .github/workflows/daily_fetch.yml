name: Daily ERP Fetch

on:
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true     

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2            

      - name: Set up Python
        uses: actions/setup-python@v5.6.0        
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install selenium beautifulsoup4 python-dotenv pytz webdriver-manager requests

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version                

      - name: Fetch ERP data
        env:
          username: ${{ secrets.ERP_USERNAME }}
          password: ${{ secrets.ERP_PASSWORD }}
        run: python erp_fetch.py

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify_discord.py
